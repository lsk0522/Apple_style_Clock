name: Build

on:
  push:
    branches: [main, main_code]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Name the build
        id: name
        run: echo "apk=nightstand-${{ github.run_number }}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Named after the run so a downloaded file is identifiable, and uploaded
      # only when the build actually succeeded. An artifact hanging off a
      # failed or cancelled run is worse than none, because it still looks
      # current in the Actions list.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.apk }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # One stable link that always points at the newest working build, so
      # there is never a question of which run to download from.
      - name: Publish rolling debug release
        if: github.ref == 'refs/heads/main_code' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          APK_NAME: ${{ steps.name.outputs.apk }}
        run: |
          cp app/build/outputs/apk/debug/*.apk "${APK_NAME}.apk"
          {
            printf '빌드 번호 %s · 커밋 %s\n\n' "$RUN_NUMBER" "$COMMIT_SHA"
            printf '설치 후 **개발자 탭 → 설치된 빌드**에서 지금 돌고 있는 버전을 확인할 수 있습니다.\n'
          } > release-notes.md
          gh release delete latest-debug --cleanup-tag --yes || true
          gh release create latest-debug \
            --title "최신 개발 빌드 (#${RUN_NUMBER})" \
            --notes-file release-notes.md \
            --prerelease \
            "${APK_NAME}.apk"

      - name: Upload reports on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports-${{ github.run_number }}
          path: |
            **/build/reports/
            **/build/outputs/logs/
          retention-days: 7
