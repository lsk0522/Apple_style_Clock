name: Build

# Documentation-only pushes must not produce a build. They would bump the
# build number and republish a byte-identical APK, which makes it impossible
# to tell which download actually contains a change.
on:
  push:
    branches: [main, main_code]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - LICENSE
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - LICENSE
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Name the build
        id: name
        run: echo "apk=nightstand-${{ github.run_number }}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Named after the run so a downloaded file is identifiable, and uploaded
      # only when the build actually succeeded. An artifact hanging off a
      # failed or cancelled run is worse than none, because it still looks
      # current in the Actions list.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.apk }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # One stable link that always points at the newest working build, so
      # there is never a question of which run to download from.
      - name: Publish rolling debug release
        if: github.ref == 'refs/heads/main_code' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          APK_NAME: ${{ steps.name.outputs.apk }}
        run: |
          # Two copies: one named after the build so a download is identifiable,
          # and one with a fixed name so the download URL never changes.
          cp app/build/outputs/apk/debug/*.apk "${APK_NAME}.apk"
          cp app/build/outputs/apk/debug/*.apk "nightstand-latest.apk"
          {
            printf '빌드 번호 %s · 커밋 %s\n\n' "$RUN_NUMBER" "$COMMIT_SHA"
            printf '아래 **nightstand-latest.apk** 를 받으세요. 이 파일 이름은 빌드가 바뀌어도 그대로라, 링크를 저장해 두고 쓰실 수 있습니다.\n\n'
            printf '설치 후 **개발자 탭 → 설치된 빌드**에서 지금 돌고 있는 버전을 확인할 수 있습니다.\n'
          } > release-notes.md
          gh release delete latest-debug --cleanup-tag --yes || true
          # Not a prerelease: GitHub only surfaces a normal release as "Latest"
          # on the repository page, and being findable there is the point.
          gh release create latest-debug \
            --title "최신 개발 빌드 (#${RUN_NUMBER})" \
            --notes-file release-notes.md \
            --latest \
            "${APK_NAME}.apk" \
            "nightstand-latest.apk"

      # Last on purpose, and with no `continue-on-error`.
      #
      # Both halves of that matter. Lint once ran with the failure suppressed,
      # and it hid a missing RECEIVE_BOOT_COMPLETED permission for days --- the
      # job was green while the feature was dead. Running it last means a lint
      # failure still turns the run red without costing us the APK, which is
      # already uploaded and released by this point.
      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      # The release build is the one R8 actually runs on, and R8 config errors
      # do not show up in a debug build at all. Unsigned is fine here — the
      # point is that shrinking completes and nothing is missing.
      - name: Assemble release (unsigned)
        run: ./gradlew assembleRelease --stacktrace
